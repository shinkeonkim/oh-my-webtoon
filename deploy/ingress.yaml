# 내부(tailnet) 확인용. *.homelab.shinkeonkim.com 와일드카드 인증서가 Traefik 기본 TLSStore 에 있다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-webtoon
spec:
  ingressClassName: traefik
  rules:
    - host: my-webtoon.homelab.shinkeonkim.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-webtoon
                port:
                  name: http
