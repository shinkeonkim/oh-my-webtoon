# 공개 도메인 my-webtoon.shinkeonkim.com 은 Cloudflare Tunnel Public Hostname 이
# http://my-webtoon.my-webtoon.svc.cluster.local:80 으로 직접 붙는다.
apiVersion: v1
kind: Service
metadata:
  name: my-webtoon
  labels:
    app.kubernetes.io/name: my-webtoon
spec:
  selector:
    app.kubernetes.io/name: my-webtoon
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics # Prometheus 전용 (monitoring.yaml). 터널은 80 에만 붙어서 공개 도메인으로는 안 보인다
      port: 9464
      targetPort: metrics
