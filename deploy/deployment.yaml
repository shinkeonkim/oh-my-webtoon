apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-webtoon
  annotations:
    reloader.stakater.com/auto: "true" # 시크릿이 바뀌면 재시작
spec:
  replicas: 1 # 평소엔 하나. 배포하는 동안만 잠깐 둘 (아래 strategy)
  # 무중단 배포: 새 파드를 먼저 띄우고(maxSurge 1) /readyz 가 200 이 되면 옛 파드를 내린다(maxUnavailable 0).
  # 두 파드가 같은 RWO 볼륨(SQLite)을 잠깐 같이 쓰려면 같은 노드여야 해서 아래 podAffinity 로 묶는다.
  # (같은 노드라면 RWO 볼륨을 여러 파드가 마운트할 수 있고, SQLite WAL 이 같은 커널 위에서 쓰기를 직렬화한다)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: my-webtoon
  template:
    metadata:
      labels: *labels
    spec:
      affinity:
        podAffinity: # 새 파드는 지금 떠 있는 my-webtoon 파드와 같은 노드로 (처음 하나는 자기 자신과 매칭돼 어디든 뜬다)
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: my-webtoon
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: my-webtoon-ghcr-pull # private ghcr 패키지 (oh-my-homelab helm-charts/secrets/my-webtoon)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/oh-my-webtoon:latest
          ports:
            - name: http
              containerPort: 8000
            - name: metrics # /metrics (src/my_webtoon/web/prom.py)
              containerPort: 9464
          env:
            - { name: DATABASE_PATH, value: /data/my-webtoon.db }
            - { name: CRAWL_ENABLED, value: "1" }
            - { name: CRAWL_INTERVAL_HOURS, value: "3" } # 3시간마다 400개 → 하루 약 3,200개 (요청 간격은 그대로 1.5초)
            - { name: CRAWL_BATCH_SIZE, value: "400" }
            - { name: CRAWL_DELAY_SECONDS, value: "1.5" }
            - { name: EXCLUDED_GENRES, value: "BL" } # 쉼표로 여러 개. 비우면 전 장르 수집
            - { name: EXCLUDED_TITLE_TAGS, value: "GL" } # 제목에 [GL] 꼬리표가 붙은 작품 (장르로는 안 걸러짐)
            - { name: BACKUP_DIR, value: /backup }
            - { name: METRICS_PORT, value: "9464" }
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef:
                name: my-webtoon-secrets # APP_PASSWORD, SESSION_SECRET
          readinessProbe: # 워밍업이 끝나야 트래픽을 받는다
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop: # 끄기 전에 잠깐 기다려 Service/터널이 이 파드로 보내던 요청을 끊을 시간을 준다
              sleep: { seconds: 8 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: backup, mountPath: /backup }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: my-webtoon-data
        - name: backup
          persistentVolumeClaim:
            claimName: my-webtoon-backup
        - name: tmp
          emptyDir: {}
