# SQLite 파일 하나. 단일 인스턴스라 storage 레벨 복제가 의미 없어 longhorn-r1
# (oh-my-homelab docs/setup/새_앱_배포_체크리스트.md 1번).
#
# 내 평가가 들어 있는 볼륨이라 ArgoCD 가 지우지 못하게 막는다:
#   Prune=false  — 이 파일에서 PVC 를 빼도 클러스터의 PVC 는 남는다
#   Delete=false — Application 을 지워도(finalizer) PVC 는 남는다
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-webtoon-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-r1
  resources:
    requests:
      storage: 2Gi
---
# 하루 한 번 DB 사본을 두는 곳. 노드 디스크가 아니라 Mac 의 NFS(nfs-mac, reclaimPolicy=Retain)라
# 노드가 통째로 죽거나 PVC 가 지워져도 Mac 쪽 디렉터리에 남는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-webtoon-backup
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-mac
  resources:
    requests:
      storage: 1Gi
