# ArgoCD(oh-my-homelab 의 helm-charts/apps/my-webtoon.yaml)가 이 디렉터리를 kustomize 로 렌더한다.
# 시크릿(my-webtoon-secrets)은 여기 없다 — oh-my-homelab 의 helm-charts/secrets/my-webtoon (SOPS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-webtoon
resources:
- namespace.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- monitoring.yaml
# Grafana 대시보드 (monitoring.yaml 주석 참고). 이름이 바뀌지 않게 해시 접미사를 끈다.
configMapGenerator:
- files:
  - my-webtoon.json=grafana-dashboard.json
  name: my-webtoon-grafana-dashboard
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
labels:
- pairs:
    app.kubernetes.io/part-of: my-webtoon
images:
- name: ghcr.io/shinkeonkim/oh-my-webtoon
  newName: ghcr.io/shinkeonkim/oh-my-webtoon
  newTag: sha-d3b2ac8
