<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}my-webtoon{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  {%- set path = request.url.path %}
  <header class="top">
    <a class="brand" href="{{ '/' if authed else '/comics' }}">my-webtoon</a>
    <nav>
      {%- if authed %}
      <a href="/" class="{{ 'on' if path == '/' }}">추천</a>
      <a href="/rate" class="{{ 'on' if path == '/rate' }}">평가하기</a>
      {%- endif %}
      <a href="/comics" class="{{ 'on' if path == '/comics' }}">작품 목록</a>
      <a href="/me" class="{{ 'on' if path == '/me' }}">평가 기록</a>
      {%- if authed %}
      <a href="/crawl" class="{{ 'on' if path == '/crawl' }}">수집</a>
      <a href="/settings" class="{{ 'on' if path == '/settings' }}">설정</a>
      {%- if auth_enabled %}
      <form method="post" action="/logout" class="inline"><button class="link">로그아웃</button></form>
      {%- endif %}
      {%- else %}
      <a href="/login" class="{{ 'on' if path == '/login' }}">로그인</a>
      {%- endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    데이터 출처: <a href="https://series.naver.com/comic/home.series" target="_blank" rel="noopener">네이버 시리즈</a> · 개인 학습용 추천기
  </footer>
</body>
</html>
