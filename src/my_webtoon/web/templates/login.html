{% extends "base.html" %}
{% block title %}로그인 · my-webtoon{% endblock %}
{% block content %}
<section class="login">
  <h1>my-webtoon</h1>
  <form method="post" action="/login">
    <input name="username" placeholder="아이디" autocomplete="username" autocapitalize="none" autofocus required>
    <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn">들어가기</button>
  </form>
  {% if error %}<p class="error">아이디나 비밀번호가 달라요.</p>{% endif %}
</section>
{% endblock %}
