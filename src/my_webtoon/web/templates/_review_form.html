{#- 세부 평가 폼. 모든 칸이 선택 사항 — 비워 두면 '없음'으로 저장된다. -#}
{%- set no = comic.product_no -%}
<form class="review review-form" hx-post="/reviews/{{ no }}" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="full" value="1">
  <div class="fields">
    <label>종합 점수
      <select name="score">
        <option value="">–</option>
        {%- for s in SCORES %}<option value="{{ s }}"{% if review and review.score == s %} selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    <label>상태
      <select name="status">
        <option value="">–</option>
        {%- for key, label in STATUSES.items() %}<option value="{{ key }}"{% if review and review.status == key %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label>본 화수
      <input type="number" name="episodes_read" min="0" inputmode="numeric"
             value="{{ review.episodes_read if review and review.episodes_read is not none else '' }}"
             placeholder="{{ comic.total_episodes or '' }}">
    </label>
  </div>
  <div class="fields aspects">
    {%- for key, label in ASPECTS.items() %}
    <label>{{ label }}
      <select name="aspect_{{ key }}">
        <option value="">–</option>
        {%- for s in SCORES %}<option value="{{ s }}"{% if review and review.aspects.get(key) == s %} selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </label>
    {%- endfor %}
  </div>
  <textarea name="memo" rows="2" placeholder="한 줄 메모 (로그인했을 때만 보여요)">{{ review.memo if review else '' }}</textarea>
  <p class="hint">종합 점수를 비우고 세부 점수만 남기면, 세부 점수 평균을 종합 점수로 써서 추천해요.</p>
  <div class="actions">
    <button class="btn">저장</button>
    <button type="button" class="chip" hx-get="/reviews/{{ no }}/widget">닫기</button>
    {%- if review %}
    <button type="button" class="chip danger" hx-post="/reviews/{{ no }}/delete"
            hx-confirm="이 작품의 평가를 전부 지울까요?">평가 삭제</button>
    {%- endif %}
  </div>
</form>
